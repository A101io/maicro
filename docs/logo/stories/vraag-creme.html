<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Vidalo story: vraag, crème</title>
<!-- Instagram story, 1080 x 1920. One loop of the "7 · De vraag" animation from ../animaties.html.
     Record it: open in Chrome, device toolbar at 1080 x 1920, screen-record one loop (10 s or less). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111827}
a{color:#2563EB}a:hover{color:#1D4ED8}

/* 1. Intro: a round dot lands, the corner snaps in, the name slides out of it. */
@keyframes vd-land{
  0%{transform:translateY(-70px) scale(.5);opacity:0;border-radius:999px}
  22%{transform:translateY(0) scale(1.06);opacity:1;border-radius:999px}
  30%{transform:scale(1);border-radius:999px}
  42%{border-radius:999px 999px 999px 7px}
  88%{opacity:1;border-radius:999px 999px 999px 7px}
  100%{opacity:0;border-radius:999px 999px 999px 7px}
}
@keyframes vd-name{
  0%,42%{opacity:0;transform:translateX(-18px);clip-path:inset(0 100% 0 0)}
  62%{opacity:1;transform:translateX(0);clip-path:inset(0 0 0 0)}
  88%{opacity:1}
  100%{opacity:0}
}
.a1-mark{animation:vd-land calc(4.6s * var(--t)) cubic-bezier(.22,.7,.2,1) infinite}
.a1-name{animation:vd-name calc(4.6s * var(--t)) cubic-bezier(.22,.7,.2,1) infinite}

/* 2. Status: the mark takes the colour of the result, in the order of the plan. */
@keyframes vd-status{
  0%,18%{background:#9CA3AF}
  25%,43%{background:#E11D48}
  50%,68%{background:#F59E0B}
  75%,93%{background:#2F855A}
  100%{background:#9CA3AF}
}
@keyframes vd-label1{0%,18%{opacity:1}25%,100%{opacity:.25}}
@keyframes vd-label2{0%,18%{opacity:.25}25%,43%{opacity:1}50%,100%{opacity:.25}}
@keyframes vd-label3{0%,43%{opacity:.25}50%,68%{opacity:1}75%,100%{opacity:.25}}
@keyframes vd-label4{0%,68%{opacity:.25}75%,93%{opacity:1}100%{opacity:.25}}
.a2-mark{animation:vd-status calc(7s * var(--t)) ease-in-out infinite}
.a2-l1{animation:vd-label1 calc(7s * var(--t)) linear infinite}
.a2-l2{animation:vd-label2 calc(7s * var(--t)) linear infinite}
.a2-l3{animation:vd-label3 calc(7s * var(--t)) linear infinite}
.a2-l4{animation:vd-label4 calc(7s * var(--t)) linear infinite}

/* 3. Controleren: the mark breathes and sends out a ring, like a check going out. */
@keyframes vd-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes vd-ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.1);opacity:0}}
.a3-mark{animation:vd-breathe calc(1.8s * var(--t)) ease-in-out infinite}
.a3-ring{animation:vd-ring calc(1.8s * var(--t)) cubic-bezier(.2,.6,.3,1) infinite}
.a3-ring2{animation:vd-ring calc(1.8s * var(--t)) cubic-bezier(.2,.6,.3,1) infinite;animation-delay:calc(.6s * var(--t))}

/* 4. Hover: the mark tips its corner towards the name and springs back. */
.a4-mark{transition:transform calc(.55s * var(--t)) cubic-bezier(.3,1.5,.5,1)}
.a4-lockup:hover .a4-mark,.a4-lockup:focus-visible .a4-mark{transform:rotate(-14deg) translateY(-5px)}
.a4-name{transition:letter-spacing calc(.55s * var(--t)) cubic-bezier(.3,1.5,.5,1)}
.a4-lockup:hover .a4-name{letter-spacing:-2px}

/* 5. App icon: the answer grows out of its own corner. */
@keyframes vd-grow{
  0%{transform:scale(0)}
  28%{transform:scale(1.1)}
  42%{transform:scale(1)}
  86%{transform:scale(1)}
  100%{transform:scale(0)}
}
.a5-mark{transform-origin:0% 100%;animation:vd-grow calc(3.6s * var(--t)) cubic-bezier(.22,.7,.2,1) infinite}

/* 6. Antwoord: the bubble pops in, the answer types out, short and certain. */
@keyframes vd-pop{0%{transform:scale(.4);opacity:0}14%{transform:scale(1.08);opacity:1}22%{transform:scale(1)}86%{opacity:1}100%{opacity:0}}
@keyframes vd-type{0%,24%{width:0}60%,86%{width:6ch}100%{width:6ch;opacity:0}}
@keyframes vd-caret{0%,24%{opacity:0}25%,86%{opacity:1}50%,76%{opacity:0}100%{opacity:0}}
.a6-mark{animation:vd-pop calc(4.2s * var(--t)) cubic-bezier(.3,1.4,.5,1) infinite}
.a6-text{animation:vd-type calc(4.2s * var(--t)) steps(6,end) infinite}
.a6-caret{animation:vd-caret calc(4.2s * var(--t)) steps(1,end) infinite}

@media (prefers-reduced-motion: reduce){
  .a1-mark,.a1-name,.a2-mark,.a2-l1,.a2-l2,.a2-l3,.a2-l4,.a3-mark,.a3-ring,.a3-ring2,.a5-mark,.a6-mark,.a6-text,.a6-caret{animation:none}
  .a1-name,.a6-text{opacity:1;clip-path:none;width:6ch}
  .a3-ring,.a3-ring2{display:none}
}

/* 7. De vraag: the mark starts as a chat field. Questions are typed, the field closes to the dot, the corner clicks in, the name slides out from behind it. */
@property --fw{syntax:'<length>';inherits:false;initial-value:0px}
@keyframes vd-field{
  0%{transform:scale(0);transform-origin:0% 100%;opacity:1;--fw:0px;min-width:180px;width:calc(var(--fw) + 49px);padding:0 22px;border-radius:999px 999px 999px 7px}
  2.2%{transform:scale(1.1);transform-origin:0% 100%}
  3.5%{transform:scale(1);transform-origin:0% 100%;opacity:1;--fw:0px;min-width:180px;width:calc(var(--fw) + 49px);padding:0 22px;border-radius:999px 999px 999px 7px}
  10%{transform:scale(1);transform-origin:50% 50%}
  4%{--fw:0px;animation-timing-function:steps(28,end)}
  16%{--fw:var(--w1)}
  25%{--fw:var(--w1)}
  26%{--fw:0px}
  26%{--fw:0px;animation-timing-function:steps(23,end)}
  38%{--fw:var(--w2)}
  47%{--fw:var(--w2)}
  48%{--fw:0px}
  48%{--fw:0px;animation-timing-function:steps(27,end)}
  60%{--fw:var(--w3)}
  69%{transform:scale(1);opacity:1;--fw:var(--w3);min-width:180px;width:calc(var(--fw) + 49px);padding:0 22px;border-radius:999px 999px 999px 7px}
  78%{--fw:0px;min-width:60px;width:60px;padding:0;border-radius:999px 999px 999px 7px}
  80%{min-width:60px;width:60px;padding:0;border-radius:999px 999px 999px 7px}
  83%{min-width:60px;width:60px;padding:0;border-radius:999px 999px 999px 7px}
  89%{transform:scale(1) rotate(0deg) translateY(0);min-width:60px;width:60px;padding:0;border-radius:999px 999px 999px 7px}
  92%{transform:scale(1) rotate(-12deg) translateY(-4px);min-width:60px;width:60px;padding:0;border-radius:999px 999px 999px 7px}
  96%{transform:scale(1) rotate(0deg) translateY(0);min-width:60px;width:60px;padding:0;border-radius:999px 999px 999px 7px}
  97%{opacity:1;min-width:60px;width:60px;padding:0;border-radius:999px 999px 999px 7px}
  100%{opacity:0;transform-origin:50% 50%;min-width:60px;width:60px;padding:0;border-radius:999px 999px 999px 7px}
}
@keyframes vd-q1{0%{max-width:0;opacity:0}4%{max-width:0;opacity:1;animation-timing-function:steps(28,end)}16%{max-width:var(--w);opacity:1}23%{max-width:var(--w);opacity:1}25%{max-width:var(--w);opacity:0}26%,100%{max-width:0;opacity:0}}
.a7-q1{animation:vd-q1 calc(10s * var(--t)) linear infinite}
@keyframes vd-q2{0%,25%{max-width:0;opacity:0}26%{max-width:0;opacity:1;animation-timing-function:steps(23,end)}38%{max-width:var(--w);opacity:1}45%{max-width:var(--w);opacity:1}47%{max-width:var(--w);opacity:0}48%,100%{max-width:0;opacity:0}}
.a7-q2{animation:vd-q2 calc(10s * var(--t)) linear infinite}
@keyframes vd-q3{0%,47%{max-width:0;opacity:0}48%{max-width:0;opacity:1;animation-timing-function:steps(27,end)}60%{max-width:var(--w);opacity:1}67%{max-width:var(--w);opacity:1}69%{max-width:var(--w);opacity:0}70%,100%{max-width:0;opacity:0}}
.a7-q3{animation:vd-q3 calc(10s * var(--t)) linear infinite}
@keyframes vd-caret-on{0%{visibility:hidden}3%{visibility:visible}69%{visibility:hidden}100%{visibility:hidden}}
@keyframes vd-blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes vd-name7{0%,83%{max-width:0;opacity:1;animation-timing-function:steps(6,end)}89%{max-width:var(--w);opacity:1}97%{max-width:var(--w);opacity:1}100%{max-width:var(--w);opacity:0}}
@keyframes vd-caret2-on{0%{visibility:hidden}81%{visibility:visible}95%{visibility:hidden}100%{visibility:hidden}}
.a7-field{animation:vd-field calc(10s * var(--t)) cubic-bezier(.22,.7,.2,1) infinite}
.a7-caret{animation:vd-caret-on calc(10s * var(--t)) steps(1,end) infinite, vd-blink calc(1s * var(--t)) steps(1,end) infinite}
.a7-name{animation:vd-name7 calc(10s * var(--t)) cubic-bezier(.22,.7,.2,1) infinite}
.a7-caret2{animation:vd-caret2-on calc(10s * var(--t)) steps(1,end) infinite, vd-blink calc(.9s * var(--t)) steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){
  .a7-field,.a7-q1,.a7-q2,.a7-q3,.a7-caret,.a7-name,.a7-caret2{animation:none}
  .a7-field{min-width:0;width:60px;padding:0;border-radius:999px 999px 999px 7px}
  .a7-q1,.a7-q2,.a7-q3,.a7-caret,.a7-caret2{display:none}
  .a7-name{max-width:none;letter-spacing:-3px}
}



html,body{margin:0;background:#E7E3DC}
.story{position:relative;width:1080px;height:1920px;margin:0 auto;overflow:hidden;background:#F4F1EC;font-family:'Plus Jakarta Sans',system-ui,sans-serif;--t:1}
.scene{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(1.55);transform-origin:50% 50%;width: 760px;}
.copy{position:absolute;left:96px;right:96px;top:1240px;font-size:60px;font-weight:800;line-height:1.2;letter-spacing:-1.5px;color:#111827}
.copy span{display:block;margin-top:28px;font-size:40px;font-weight:500;line-height:1.35;letter-spacing:0;color:#374151}
.a7-stage{transform:none !important}
.site{position:absolute;left:96px;bottom:168px;font-size:38px;font-weight:600;color:#2563EB}
</style>
</head>
<body>
<div class="story">
  <div class="scene">
<div style="flex: 1; min-height: 200px; display: flex; align-items: center; justify-content: center">
      <div class="a7-stage" style="display: flex; align-items: flex-end; gap: 16px; transform-origin: 50% 100%" role="img" aria-label="Een chatveld waarin klantvragen worden getypt, dat het Vidalo logo wordt">
        <span class="a7-field" style="transform-origin: 0% 100%; display: flex; align-items: center; box-sizing: border-box; min-width: 180px; width: calc(var(--fw) + 49px); height: 60px; padding: 0 22px; border: 1.5px solid #2563EB; border-radius: 999px 999px 999px 7px; background: #2563EB; margin-bottom: 9px; overflow: hidden; white-space: nowrap">
          <span style="display: inline-grid; font-size: 22px; font-weight: 500; line-height: 1.4; color: #FFFFFF">
            <span class="a7-q a7-q1" style="grid-area: 1 / 1; display: inline-block; overflow: hidden; white-space: nowrap; max-width: 0">Is de bakker op zondag open?</span>
            <span class="a7-q a7-q2" style="grid-area: 1 / 1; display: inline-block; overflow: hidden; white-space: nowrap; max-width: 0">Wat kost een knipbeurt?</span>
            <span class="a7-q a7-q3" style="grid-area: 1 / 1; display: inline-block; overflow: hidden; white-space: nowrap; max-width: 0">Bezorgen ze ook in Haarlem?</span>
          </span>
          <span class="a7-caret" style="display: inline-block; flex: none; width: 2px; height: 24px; background: #FFFFFF; margin-left: 3px"></span>
        </span>
        <span class="a7-name" style="display: inline-block; overflow: hidden; white-space: nowrap; padding: 0.12em 0 0.16em 0; margin-bottom: -0.16em; font-weight: 800; font-size: 84px; line-height: 1; letter-spacing: -3px; color: #111827; max-width: 0">vidalo</span><span class="a7-caret2" style="display: inline-block; flex: none; width: 5px; height: 64px; background: #2563EB; margin: 0 0 14px -12px"></span>
      </div>
    </div>
  </div>
  <div class="copy">Je klanten vragen het aan ChatGPT.<span>Wij zorgen dat het antwoord klopt.</span></div>
  <div class="site">vidalo.io</div>
</div>
<script>
// Card 7: the typed questions and the name stop at their real width, measured from a copy of the text
// that is not animated, once the font is in. The lockup scales down when the window is narrow.
(function () {
  function widthOf(el) {
    var c = el.cloneNode(true);
    c.className = '';
    c.querySelectorAll('*').forEach(function (n) { n.className = ''; });
    c.style.cssText = el.style.cssText + ';position:absolute;visibility:hidden;max-width:none;animation:none' + (el.classList.contains('a7-name') ? ';letter-spacing:-3px' : '');
    el.parentNode.appendChild(c);
    var w = c.scrollWidth; // layout width: unaffected by the stage's scale, unlike getBoundingClientRect
    if (el.classList.contains('a7-q')) w += 4; // the question mark's right side
    if (el.classList.contains('a7-name')) w += 6; // the o's right side, outside the clipped box
    c.remove();
    return Math.ceil(w + 1);
  }
  function measure() {
    var field = document.querySelector('.a7-field');
    document.querySelectorAll('.a7-q, .a7-name').forEach(function (el) {
      el.style.setProperty('--w', widthOf(el) + 'px');
    });
    document.querySelectorAll('.a7-q').forEach(function (el, i) {
      field.style.setProperty('--w' + (i + 1), el.style.getPropertyValue('--w'));
    });
  }
  function fit() {
    var stage = document.querySelector('.a7-stage');
    if (!stage) return;
    var room = stage.parentNode.getBoundingClientRect().width;
    stage.style.transform = 'scale(' + Math.min(1, room / 760) + ')';
  }
  function all() { measure(); fit(); }
  all();
  window.addEventListener('load', all);
  window.addEventListener('resize', fit);
  if (document.fonts) {
    document.fonts.load("500 22px 'Plus Jakarta Sans'");
    document.fonts.load("800 80px 'Plus Jakarta Sans'");
    document.fonts.ready.then(all);
    document.fonts.addEventListener('loadingdone', all);
  }
  setTimeout(all, 1500);
  setTimeout(all, 4000);
})();
</script>
<script>
// Preview: shrink the story to fit the window. At exactly 1080 x 1920 (the recording size) this is 1.
(function(){function fit(){var s=document.querySelector('.story');s.style.zoom=Math.min(1,innerWidth/1080,innerHeight/1920);}fit();addEventListener('resize',fit);})();
</script>
</body>
</html>
