<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Vidalo primair logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111827}
a{color:#2563EB}a:hover{color:#1D4ED8}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div style="display: flex; align-items: flex-end; gap: 30px" role="img" aria-label="Vidalo">
    <span style="width: 126px; height: 126px; border-radius: 999px 999px 999px {{corner}}px; background: {{dot}}; margin-bottom: 19px"></span>
    <span style="font-weight: 800; font-size: 168px; line-height: 1; letter-spacing: -7px; color: #111827">vidalo</span>
  </div>
  <div style="display: flex; gap: 28px; font-size: 14px; font-weight: 500; color: #6B7280; letter-spacing: 0">
    <span>Beeldmerk en woordmerk</span>
    <span>Plus Jakarta Sans 800</span>
    <span>Ink #111827</span>
    <span>Stip #2563EB</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dot":{"editor":"color","default":"#2563EB","options":["#2563EB","#2F855A","#E11D48","#9CA3AF"],"section":"Stip"},"corner":{"editor":"range","default":12,"min":0,"max":40,"step":2,"unit":"px","section":"Stip"},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { dot: this.props.dot ?? '#2563EB', corner: this.props.corner ?? 12 };
  }
}
</script>
</body>
</html>
