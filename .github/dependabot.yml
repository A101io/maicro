# Baseline H7: weekly, minor and patch only (Julian, 13 Oct 2026).
# Major upgrades (TypeScript 7, Tailwind 4, Zod 4 ...) change behaviour and get
# their own deliberate PR. Security updates still open on their own, whatever
# the version jump, because they are not governed by this file's ignore list.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
