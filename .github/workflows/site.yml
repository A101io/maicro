name: Preview site

# Builds the web app in mock mode, saves every page as static HTML
# (scripts/site/snapshot.mjs) and publishes that to GitHub Pages.
# Pull requests build and check the copy; only main deploys it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAICRO_MOCK: "1"
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @maicro/web build
      - name: Start the app
        run: |
          pnpm --filter @maicro/web start -p 3000 > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 1; done
          cat web.log; exit 1
      - run: node scripts/site/snapshot.mjs http://localhost:3000 out/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
